# Vórtex Pro — Docker Compose para produção
#
# Stack:
#   - caddy:      reverse proxy + TLS automático (Let's Encrypt)
#   - backend:    API Node.js + better-sqlite3
#   - ai-worker:  worker BullMQ para jobs assíncronos
#   - redis:      cache, rate limiting, filas
#
# Volumes persistentes:
#   - db_data:     /app/data           (banco SQLite)
#   - logs_data:   /app/logs           (winston logs)
#   - caddy_data:  certs Let's Encrypt + state
#   - caddy_config: configurações persistentes do Caddy
#   - redis_data:  AOF do Redis
#
# Deploy (passo a passo completo no DEPLOY.md):
#   1. ./deploy/scripts/install.sh  (cria o .env a partir do .env.example e gera
#      JWT_SECRET, WEBHOOK_SECRET e POSTGRES_PASSWORD aleatórios; depois
#      preencha DOMAIN, LETSENCRYPT_EMAIL e uma chave de IA)
#   2. ./deploy/scripts/deploy.sh   (ou: docker compose up -d --build)
#   3. Logs: docker compose logs -f
#   4. Backup: ./deploy/scripts/backup.sh
#   5. Update: ./deploy/scripts/deploy.sh

services:

  # ── Caddy: Reverse proxy + TLS automático ────────────────────────────────
  # Lida com Let's Encrypt sem você precisar pensar em renovação de certificado.
  # Renova automaticamente 30 dias antes de expirar.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (redirect to HTTPS)
      - "443:443"   # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # certs Let's Encrypt + state
      - caddy_config:/config        # config persistida
    environment:
      # Entre aspas: sem elas, o ": " dentro da mensagem "(ex: ...)" faz o YAML
      # ler o item como um mapa, e o compose recusa o arquivo inteiro.
      - "DOMAIN=${DOMAIN:?DOMAIN is required (ex: api.seudominio.com)}"
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wh_network
    healthcheck:
      # API admin do Caddy (só escuta dentro do container). O teste antigo,
      # http://localhost:80, levava um redirect 308 para https://localhost/ — sem
      # certificado para "localhost" — e falhava sempre: o caddy ficava
      # "unhealthy" mesmo servindo normal. O caminho HTTPS público é conferido
      # pelo health.sh (https://$DOMAIN/health).
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # ⚠️ Sem `ports:` — Redis só acessível pela rede interna do compose.
    # Antes expunha 6379 publicamente — risco de acesso não autenticado.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wh_network

  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./whatshybrid-backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    # ⚠️ Sem `ports:` — backend só acessível pelo Caddy.
    # Antes expunha 3000 publicamente — bypassava TLS e rate limiting.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # AUDITORIA 2026-06-10: config/index.js RECUSA subir sem WEBHOOK_SECRET
      # (mín. 16 chars). O compose não repassava a variável → container em
      # crash-loop no primeiro deploy (provado em simulação). O :? falha já
      # no `docker compose up` com mensagem clara, em vez de loop silencioso.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required (>=16 chars)}
      # Kill switch da IA (POST /api/v1/admin/kill-switch/set): em produção a
      # chave padrão é recusada e, sem esta variável, a rota responde 503 —
      # não haveria como desligar a IA nem o autopilot. Sem valor padrão aqui
      # de propósito: um padrão no compose seria uma chave pública.
      - ADMIN_KILL_SWITCH_KEY=${ADMIN_KILL_SWITCH_KEY:-}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # IA-41: modelos da Groq (vazio = padrão do código); a Groq desativa modelos.
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-}
      - DB_PATH=/app/data/whatshybrid.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ORCHESTRATOR_MAX_TENANTS=${ORCHESTRATOR_MAX_TENANTS:-200}
      - ORCHESTRATOR_TTL_MS=${ORCHESTRATOR_TTL_MS:-1800000}
      # AUDITORIA 2026-06-10: o config lê CORS_ORIGIN (singular) — o antigo
      # CORS_ORIGINS era ignorado e a restrição aparente não valia. O default
      # INCLUI chrome-extension://* de propósito: em produção o config só
      # aceita origens de extensão se o wildcard estiver explícito na lista
      # (IDs de extensão variam por instalação até publicar na Web Store;
      # depois de publicar, dá pra trocar o wildcard pelo ID fixo).
      # Vale também para o WebSocket: o Socket.IO (src/server.js) usa a mesma
      # lista. (O antigo src/websocket/SocketManager.js, que lia CORS_ORIGINS,
      # era código morto — nada o carregava — e foi removido.)
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${DOMAIN},chrome-extension://*}
      - REDIS_DISABLED=${REDIS_DISABLED:-false}
      # ── Billing (MercadoPago) ──────────────────────────────────────────
      # Sem essas envs o checkout não consegue criar preference/preapproval
      # e o webhook rejeita as notificações em prod — fluxo de compra
      # quebra silenciosamente. Defaults vazios pra dev/staging funcionar;
      # prod EXIGE setar tudo (ver DEPLOY.md Passo 4).
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - MERCADOPAGO_USE_SANDBOX=${MERCADOPAGO_USE_SANDBOX:-false}
      # PUBLIC_BASE_URL é usada em (a) notification_url do webhook MP,
      # (b) CTAs dos emails, (c) redirects de checkout. Default deriva
      # de DOMAIN — que já é obrigatório acima.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://${DOMAIN}}
      # ── Email transacional (SendGrid) ──────────────────────────────────
      # Sem SENDGRID_API_KEY o EmailService roda em DRY-RUN: emails só
      # são logados no stdout, nunca chegam no cliente. O código de
      # assinatura gerado no webhook NÃO é entregue.
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@whatshybrid.com.br}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Vórtex Pro}
      # Master key opcional pra acesso enterprise sem código (debug/QA).
      # Em prod, deixe vazio.
      - SUBSCRIPTION_MASTER_KEY=${SUBSCRIPTION_MASTER_KEY:-}
      # ── Login com Google (opcional) ────────────────────────────────────
      # Sem isso o botão "Continuar com Google" fica escondido no login/signup.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      # ── Pixel / Analytics server-side (opcionais) ──────────────────────
      # Meta Conversions API (src/services/MetaCapiService.js) e GA4
      # Measurement Protocol (src/services/GoogleAnalyticsMpService.js).
      # Vazios = no-op. GA4_DEBUG só liga com o valor 1.
      - META_PIXEL_ID=${META_PIXEL_ID:-}
      - META_CAPI_TOKEN=${META_CAPI_TOKEN:-}
      - META_TEST_EVENT_CODE=${META_TEST_EVENT_CODE:-}
      - META_API_VERSION=${META_API_VERSION:-v18.0}
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
      - GA4_API_SECRET=${GA4_API_SECRET:-}
      - GA4_DEBUG=${GA4_DEBUG:-false}
      # ── Sentry (opcional) ──────────────────────────────────────────────
      # SENTRY_DSN: erros 500 do backend (@sentry/node). Vazio = desligado.
      # SENTRY_DSN_BROWSER: erros JS da landing e do dashboard (via /config.js).
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_DSN_BROWSER=${SENTRY_DSN_BROWSER:-}
      # ── Frontend público (entregues ao navegador via GET /config.js) ───
      - CRISP_WEBSITE_ID=${CRISP_WEBSITE_ID:-}
      - CHROME_WEBSTORE_URL=${CHROME_WEBSTORE_URL:-}
    volumes:
      - db_data:/app/data
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - wh_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ── AI Worker ────────────────────────────────────────────────────────────
  ai-worker:
    build:
      context: ./whatshybrid-backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: ["node", "src/jobs/ai-worker.js"]
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # Mesmo motivo do backend: o worker carrega o mesmo config, que exige
      # WEBHOOK_SECRET no boot (auditoria 2026-06-10).
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required (>=16 chars)}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # IA-41: modelos da Groq (vazio = padrão do código); a Groq desativa modelos.
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-}
      - DB_PATH=/app/data/whatshybrid.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
    volumes:
      - db_data:/app/data
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - wh_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ── PostgreSQL (opcional, profile "postgres") ────────────────────────────
  # ⚠️ AINDA NÃO SUPORTADO EM PRODUÇÃO: o backend roda em SQLite. O driver pg é
  # assíncrono e parte do código ainda usa a API síncrona (o job smoke-postgres
  # do CI documenta esse gap). Este serviço só sobe com `--profile postgres`, e
  # o backend não recebe DB_DRIVER nem DATABASE_URL — ligado, ele não é usado.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]   # só sobe com --profile postgres (ou COMPOSE_PROFILES=postgres)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatshybrid}
      POSTGRES_USER: ${POSTGRES_USER:-whatshybrid}
      # Sem `:?` de propósito: o compose interpola o arquivo inteiro, inclusive
      # serviços de profiles desligados, e o `:?` travava `up`/`build` de quem
      # não usa Postgres. A imagem do postgres já se recusa a iniciar sem
      # senha. O install.sh gera uma senha aleatória no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - wh_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-whatshybrid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Uptime Kuma (v9.0.0): status page pública ────────────────────────────
  # Acesso via subdomain: configure status.seudominio.com.br no Caddy
  # Após primeiro start: acesse e configure admin user + checks
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ["monitoring"]   # opt-in
    volumes:
      - kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"   # bind localhost — Caddy proxy
    networks:
      - wh_network
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 60s
      timeout: 30s
      retries: 3

volumes:
  redis_data:
    driver: local
  db_data:
    driver: local
  logs_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  pg_data:
    driver: local
  kuma_data:
    driver: local

networks:
  wh_network:
    driver: bridge
