name: Security

# Endurecimento de segurança do CI (repo público → CodeQL/dependency-review
# são gratuitos; gitleaks é free p/ contas pessoais/públicas).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # semanal (segunda 04:27 UTC) — re-scan do CodeQL

permissions:
  contents: read

jobs:
  # ── Secret scanning (gitleaks) ──────────────────────────────────────────────
  # Config em .gitleaks.toml (allowlist enxuto p/ fixtures de teste). Verificado
  # localmente: 0 leaks no working tree e no histórico.
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo p/ o gitleaks detect
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── SAST (CodeQL) ───────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  # ── Dependency review (gateia deps vulneráveis NOVAS em PR) ──────────────────
  # Gateia o DELTA do PR (não reprova pelo débito de vulnerabilidades já
  # existente). Repo público → API de dependency graph disponível.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Trivy (vuln + IaC/misconfig + secret) → SARIF no Security tab ────────────
  # Defesa em profundidade: cobre vulnerabilidades do sistema de arquivos, erros
  # de configuração (Dockerfile/compose) e segredos. Report-only (publica no
  # code scanning) — o gate BLOQUEANTE de dependências é o ci.yml → audit-gate.js;
  # o de segredos é o gitleaks acima. Aqui o objetivo é visibilidade contínua.
  trivy:
    name: Trivy (filesystem scan)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true # report-only: não falha o build por achados/infra
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
